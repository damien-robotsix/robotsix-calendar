# central-deploy-contract-version: 1
services:
  calendar-agent:
    image: ghcr.io/damien-robotsix/robotsix-calendar:main
    ports:
      - "8201:8080"
    volumes:
      - calendar-agent-config:/app/config
    labels:
      robotsix.deploy.config-target: /app/config/config.json
      # Subscription auth for the claude-sdk transport (llmio's default
      # provider slot): central-deploy mounts its managed `claude-auth`
      # volume at this path at deploy time (not listed under volumes:).
      # The app user's home is /app (useradd -d /app), so the Claude CLI
      # looks for credentials in /app/.claude.
      robotsix.deploy.claude-mount: /app/.claude
    environment:
      ROBOTSIX_CONFIG_FILE: /app/config/config.json
    healthcheck:
      test: ["CMD", "calendar-agent-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  calendar-agent-config:
