name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-ci:
    name: Python CI (shared)
    permissions:
      contents: read
      security-events: write  # the shared workflow uploads SARIF; job-level permissions REPLACE the top-level block
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@77e10e286717cfe0eeb6b8d9ce985f3794236d15  # main
    with:
      python-version: "3.14"
      uv-version: "0.12.5"
      install-extras: ""
      cov-package: robotsix_calendar_agent
      coverage-threshold: "85"
      # The in-process Radicale integration suite runs in the dedicated
      # `integration` job below; the shared spine should cover only the
      # unit suite (and its coverage gate).
      pytest-args: -m "not integration"

  security:
    permissions:
      contents: read
      security-events: write  # upload SARIF from the scan
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@f343f5ca84b1d54bb4c2fdcb83568724aa9f743c  # main
    with:
      uv-version: "0.12.5"
      install-extras: ""
      trufflehog-pr-diff: true
      trufflehog-extra-args: "--results=verified,unknown"

  baseline:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@f343f5ca84b1d54bb4c2fdcb83568724aa9f743c  # main
    with:
      has-docker: true
      # has-board enables the shared modules-drift job (validate +
      # check-registration + validate-paths), replacing the hand-rolled
      # modules-validate job.
      has-board: true
      uv-version: "0.12.5"

  docker-pr-scan:
    permissions:
      contents: read
      security-events: write  # needed to upload SARIF results to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@77e10e286717cfe0eeb6b8d9ce985f3794236d15  # main

  # hand-rolled: no shared workflow equivalent in robotsix-github-workflows
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # hand-rolled: no shared workflow equivalent in robotsix-github-workflows
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-uv
      - run: uv sync --frozen
      - run: uv run pytest -m integration tests/
