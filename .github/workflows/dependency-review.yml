name: Dependency Review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      # Policy (severity threshold, license allowlist, PR summary comment)
      # lives in the config file; do not duplicate its keys as inputs.
      config-file: .github/dependency-review-config.yml
    permissions:
      contents: read        # check out the caller repo to read the config file
      pull-requests: write  # comment-summary-in-pr posts the review summary
