name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@6864c0e182134fde48fec1b7785e970f7eaa8d1c  # main
    with:
      languages: python
      queries: security-extended
    permissions:
      contents: read          # the shared workflow's job checks out the repo
      security-events: write  # needed to upload SARIF results from CodeQL