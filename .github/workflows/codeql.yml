name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@2d66a20eef37f8b8dd5bb66cc134c76dbbf9ad39
    with:
      languages: python
      queries: security-extended
    permissions:
      security-events: write  # needed to upload SARIF results from CodeQL