name: Lint workflows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@6864c0e182134fde48fec1b7785e970f7eaa8d1c  # main
    with:
      run-actionlint: true
      run-zizmor: true
