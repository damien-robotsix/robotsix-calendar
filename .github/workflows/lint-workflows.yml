name: Lint workflows
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@c4caf23ade98668434145f5b1abd3bc42cec63e7  # main
    with:
      run-actionlint: true
      run-zizmor: true
