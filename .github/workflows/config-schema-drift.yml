name: Config schema drift

on:
  push:
    paths:
      - "src/robotsix_calendar_agent/settings/__init__.py"
      - "config/config.schema.json"
      - "config/config.json"
  pull_request:
    paths:
      - "src/robotsix_calendar_agent/settings/__init__.py"
      - "config/config.schema.json"
      - "config/config.json"

concurrency:
  group: config-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-drift:
    name: Check config schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - name: Regenerate config schema
        run: |
          uv run --frozen python -c "
          from robotsix_config import config_schema_json
          from robotsix_calendar_agent.settings import Settings
          with open('config/config.schema.json', 'w') as f:
              f.write(config_schema_json(Settings))
          "

      - name: Check for drift
        run: git diff --exit-code config/config.schema.json

      - name: Check config.json keys
        run: |
          uv run --frozen python -c "
          from robotsix_calendar_agent.settings import Settings
          import json, sys
          with open('config/config.json') as f:
              config_keys = set(json.load(f).keys())
          settings_keys = set(Settings.model_fields.keys())
          missing = settings_keys - config_keys
          if missing:
              print(f'ERROR: config/config.json is missing keys: {sorted(missing)}')
              print('Add them with their default values to config/config.json.')
              sys.exit(1)
          print('config/config.json has all expected keys.')
          "
