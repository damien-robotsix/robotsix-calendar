name: Config schema drift

on:
  push:
    paths:
      - "src/robotsix_calendar/settings/__init__.py"
      - "config/config.schema.json"
      - "config/config.json"
  pull_request:
    paths:
      - "src/robotsix_calendar/settings/__init__.py"
      - "config/config.schema.json"
      - "config/config.json"

concurrency:
  group: config-schema-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-drift:
    name: Check config schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-uv

      - name: Check config schema is up to date
        run: |
          uv run --frozen robotsix-config schema --check robotsix_calendar.settings.Settings

      - name: Check config.json keys
        run: |
          uv run --frozen robotsix-config config --check-keys robotsix_calendar.settings.Settings --config config/config.json
