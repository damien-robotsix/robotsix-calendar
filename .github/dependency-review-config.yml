fail-on-severity: moderate
comment-summary-in-pr: true
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - HPND
  - HPND-Markus-Kuhn
allow-dependencies-licenses:
  - 'pkg:pypi/commitizen'
  - 'pkg:pypi/tomlkit'
  - 'pkg:pypi/wrapt'
  # justification: secure (TypeError/secure) code is MIT-licensed; the
  # CC-BY-SA-2.5/4.0 entries in its SPDX expression cover bundled
  # documentation text only, not the runtime library we import.
  - 'pkg:pypi/secure'
