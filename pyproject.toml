[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-calendar-agent"
version = "0.1.0"
description = "Calendar and contacts agent for Radicale"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Damien Robotsix", email = "damien.robotsix@gmail.com" }]
dependencies = [
    # The intent parser uses llmio's default provider (openrouter); the
    # provider extra must be installed or get_provider() raises ImportError. The
    # tracing extra pulls the OpenTelemetry/OTLP deps setup_langfuse_tracing()
    # needs to export intent-parse traces to Langfuse.
    "robotsix-llmio[openrouter,tracing]",
    "robotsix-config",
    "robotsix-http",
    "caldav",
    "pydantic",
    # opentelemetry-api provides opentelemetry.trace used directly by
    # healthcheck; declared explicitly so the healthcheck entry point does not
    # rely on robotsix-llmio[tracing] pulling it in transitively.
    "opentelemetry-api",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
calendar-agent = "robotsix_calendar_agent.entrypoint:main"
calendar-agent-healthcheck = "robotsix_calendar_agent.healthcheck:main"

[project.urls]
Homepage = "https://github.com/damien-robotsix/robotsix-calendar-agent"
Repository = "https://github.com/damien-robotsix/robotsix-calendar-agent"
Issues = "https://github.com/damien-robotsix/robotsix-calendar-agent/issues"

[dependency-groups]
dev = [
    "commitizen>=4.17.0,<5",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "vulture",
    "deptry>=0.20",
    "radicale",
    "hypothesis>=6.163.0",
    "robotsix-modules",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-pydantic",
]

[tool.uv]
exclude-newer = "2026-08-06T00:00:00Z"
# Exempt ruff from the `exclude-newer` cutoff: dependabot bumps ruff frequently
# and a fixed cutoff freezes it out of every release published after it.
exclude-newer-package = { ruff = false }

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config.git", rev = "f557bffaf8f7d26d86a508ab7f634133c748c347" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio.git", rev = "73f2d555caa21de47a3732824d776e04719b3011" }  # pragma: allowlist secret
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "70baf170b66904c9a6570563cce0ac75b6103f58" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "b2e82231fa2f260589be9ba757c6be450f4e5d3e" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_calendar_agent"]

[tool.deptry]
known_first_party = ["robotsix_calendar_agent"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "T10", "EXE", "ARG", "C4", "PERF", "PT", "ERA", "PGH", "D"]
ignore = ["S101", "PT006", "D105", "D107", "D205", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/robotsix_calendar_agent/healthcheck/__init__.py" = ["T201"]
"vulture_whitelist.py" = ["B018", "F821", "D"]
"tests/**/*.py" = ["S105", "S106", "S603", "D"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["vulture_whitelist.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
    "error",
]
markers = ["integration: Slower tests using an in-process Radicale server"]
strict_markers = true

[tool.coverage.run]
source = ["robotsix_calendar_agent"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "src/robotsix_calendar_agent/__init__.py",
]
update_changelog_on_bump = true
changelog_incremental = true
tag_format = "v$version"
