[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-calendar"
version = "0.2.0"
description = "Calendar and contacts agent for Radicale"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Damien Robotsix", email = "damien.robotsix@gmail.com" }]
dependencies = [
    # The intent parser runs on llmio's default provider slot (Anthropic via
    # the Claude SDK — claude_sdk extra) with OpenRouter as the automatic
    # failover slot (openrouter extra); both extras must be installed or the
    # resolved backend raises ImportError. The tracing extra pulls the
    # OpenTelemetry/OTLP deps setup_langfuse_tracing() needs to export
    # intent-parse traces to Langfuse.
    "robotsix-llmio[claude_sdk,openrouter,tracing]",
    "robotsix-config",
    "robotsix-http[fastapi]",
    "caldav",
    "pydantic",
    "fastapi",
    "uvicorn",
    # opentelemetry-api provides opentelemetry.trace used directly by
    # healthcheck; declared explicitly so the healthcheck entry point does not
    # rely on robotsix-llmio[tracing] pulling it in transitively.
    "opentelemetry-api",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
calendar-agent = "robotsix_calendar.entrypoint:main"
calendar-agent-healthcheck = "robotsix_calendar.healthcheck:main"

[project.urls]
Homepage = "https://github.com/damien-robotsix/robotsix-calendar"
Repository = "https://github.com/damien-robotsix/robotsix-calendar"
Issues = "https://github.com/damien-robotsix/robotsix-calendar/issues"

[dependency-groups]
dev = [
    "commitizen>=4.17.0,<5",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "vulture",
    "deptry>=0.20",
    "radicale",
    "hypothesis>=6.163.0",
    "robotsix-modules",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-pydantic",
]

[tool.uv]
# Supply-chain cooldown: resolve only releases at least 3 days old (relative
# window, uv >= 0.9 syntax — same policy as robotsix-board). A fixed date
# (previously 2026-08-06) froze the graph and blocked every robotsix-llmio
# bump once it required openai>=3, which was published after that date; a
# rolling window keeps the cooldown without needing per-package exemptions
# for each CVE fix released after a stale cutoff.
exclude-newer = "3 days"
# robotsix-llmio pins robotsix-http to its own rev via `tool.uv.sources`,
# which uv propagates transitively.  Override it so the whole dependency graph
# unifies on the rev pinned in `[tool.uv.sources]` below (the same rev llmio
# pins; it ships the `robotsix_http.fastapi` service-bootstrap and
# `create_chat_skill_router` / `assert_chat_skill_route_parity` used by the
# API layer).
override-dependencies = [
    # CodeQL/Trivy CVE-scan floors for transitive deps flagged by the security
    # job.
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "pyjwt[crypto]>=2.15.0",
    "urllib3>=2.8.0",
    # virtualenv 21.5.0 is flagged for 8 advisories (PYSEC-2026-4011..4014 and
    # GHSA-94p9-xgh2-xp45 / 9h9j-4vrj-gf7g / p58f-9548-mpm2 / x78j-v8h9-3j2q);
    # all are fixed by 21.7.13, the highest fix version across the set.
    "virtualenv>=21.7.13",
    # mcp 1.29.0 is flagged for CVE-2026-59951; 1.30.0 is the fix within
    # claude-agent-sdk's mcp>=1.23.0,<2.0.0 range (2.2.0 is out of range).
    "mcp>=1.30.0,<2",
    # certifi 2026.5.20 is flagged for GHSA-6q48-6c7w-9gw2; 2026.10.19 is the fix.
    "certifi>=2026.10.19",
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@4bf6c1e317ccdf4f2e2764ad05c97a456b1ca0a1",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config.git", rev = "8aca9167294af2e67be63e8673715154ec510a71" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio.git", rev = "3fb688be8cea3dbcb95430b5c72fdca096d710a6" }  # pragma: allowlist secret
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "4bf6c1e317ccdf4f2e2764ad05c97a456b1ca0a1" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "b2e82231fa2f260589be9ba757c6be450f4e5d3e" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_calendar"]

[tool.deptry]
known_first_party = ["robotsix_calendar"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "T10", "EXE", "ARG", "C4", "PERF", "PT", "ERA", "PGH", "D"]
ignore = ["S101", "PT006", "D105", "D107", "D205", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/robotsix_calendar/healthcheck/__init__.py" = ["T201"]
"vulture_whitelist.py" = ["B018", "F821", "D"]
"tests/**/*.py" = ["S105", "S106", "S603", "D"]
"src/robotsix_calendar/api/**/*.py" = ["B008", "ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["vulture_whitelist.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
    "error",
]
markers = ["integration: Slower tests using an in-process Radicale server"]
strict_markers = true

[tool.coverage.run]
source = ["robotsix_calendar"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "src/robotsix_calendar/__init__.py",
]
update_changelog_on_bump = true
changelog_incremental = true
tag_format = "v$version"
