[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-calendar"
version = "0.1.0"
description = "Calendar and contacts agent for Radicale"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Damien Robotsix", email = "damien.robotsix@gmail.com" }]
dependencies = [
    # The intent parser runs on llmio's default provider slot (Anthropic via
    # the Claude SDK — claude_sdk extra) with OpenRouter as the automatic
    # failover slot (openrouter extra); both extras must be installed or the
    # resolved backend raises ImportError. The tracing extra pulls the
    # OpenTelemetry/OTLP deps setup_langfuse_tracing() needs to export
    # intent-parse traces to Langfuse.
    "robotsix-llmio[claude_sdk,openrouter,tracing]",
    "robotsix-config",
    "robotsix-http[fastapi]",
    "caldav",
    "pydantic",
    "fastapi",
    "uvicorn",
    # opentelemetry-api provides opentelemetry.trace used directly by
    # healthcheck; declared explicitly so the healthcheck entry point does not
    # rely on robotsix-llmio[tracing] pulling it in transitively.
    "opentelemetry-api",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
calendar-agent = "robotsix_calendar.entrypoint:main"
calendar-agent-healthcheck = "robotsix_calendar.healthcheck:main"

[project.urls]
Homepage = "https://github.com/damien-robotsix/robotsix-calendar"
Repository = "https://github.com/damien-robotsix/robotsix-calendar"
Issues = "https://github.com/damien-robotsix/robotsix-calendar/issues"

[dependency-groups]
dev = [
    "commitizen>=4.17.0,<5",
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "vulture",
    "deptry>=0.20",
    "radicale",
    "hypothesis>=6.163.0",
    "robotsix-modules",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-pydantic",
]

[tool.uv]
exclude-newer = "2026-08-06T00:00:00Z"
# Exempt ruff from the `exclude-newer` cutoff: dependabot bumps ruff frequently
# and a fixed cutoff freezes it out of every release published after it.
# httpx2/httpcore2 are transitive deps of genai-prices (pulled in by
# robotsix-llmio). The 2.4.0 releases pinned by the graph trip code-scanning
# CVEs (CVE-2026-84379..84382); the patched 2.13.0 releases were published
# after the exclude-newer cutoff above, so exempt just these two packages from
# the cutoff (same mechanism used for ruff) and floor them via
# override-dependencies. This keeps genai-prices at its current version — a
# plain override without the exemption would backtrack genai-prices/pydantic-ai
# instead of upgrading httpx2.
# pydantic-ai-slim, pyjwt and urllib3 ship their CVE fixes (see
# override-dependencies below) in releases published after the exclude-newer
# cutoff, so exempt just those packages from the cutoff (same mechanism as
# ruff/httpx2) to let the patched versions resolve. pydantic-graph is the
# lockstep companion of pydantic-ai-slim (pinned ==1.107.7 by it), so it must
# be exempted alongside. virtualenv (dev/tooling transitive) ships its CVE
# fixes (PYSEC-2026-4011..4014 / GHSA-*) in 21.7.x releases published after the
# cutoff, so exempt it too so the patched version can resolve.
# mcp (transitive via claude-agent-sdk, pulled in by robotsix-llmio[claude_sdk])
# is flagged for CVE-2026-59951 at 1.29.0; the fix 1.30.0 was published after
# the exclude-newer cutoff, so exempt it (same mechanism as ruff/httpx2) and
# floor it via override-dependencies below. 1.30.0 is the only fix within
# claude-agent-sdk's mcp>=1.23.0,<2.0.0 range (2.2.0 is out of range).
# certifi (transitive via httpx/requests/niquests) is flagged for
# GHSA-6q48-6c7w-9gw2 at 2026.5.20; the fix 2026.10.19 was published after the
# exclude-newer cutoff, so exempt it (same mechanism as ruff/httpx2) and floor
# it via override-dependencies below.
exclude-newer-package = { ruff = false, httpx2 = false, httpcore2 = false, pydantic-ai-slim = false, pydantic-graph = false, pyjwt = false, urllib3 = false, virtualenv = false, python-discovery = false, mcp = false, certifi = false }
# robotsix-llmio still pins robotsix-http to an older rev via its own
# `tool.uv.sources`, which uv propagates transitively.  Override it so the
# whole dependency graph unifies on the rev that ships the
# `robotsix_http.fastapi` service-bootstrap adopted by the API layer.  The
# pinned rev additionally ships `create_chat_skill_router` /
# `assert_chat_skill_route_parity`, and is a descendant of llmio's pin, so it
# stays forward-compatible for llmio's `robotsix_http.retry` usage.
override-dependencies = [
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    # CodeQL/Trivy CVE-scan floors for transitive deps flagged by the security
    # job. pydantic-ai-slim is capped below 2 so the fix stays on the 1.107.x
    # patch line adopted by robotsix-llmio (a plain >= would backtrack the
    # whole pydantic-ai/openai/genai-prices graph to 2.x).
    "pydantic-ai-slim>=1.107.7,<2",
    "pyjwt[crypto]>=2.15.0",
    "urllib3>=2.8.0",
    # virtualenv 21.5.0 is flagged for 8 advisories (PYSEC-2026-4011..4014 and
    # GHSA-94p9-xgh2-xp45 / 9h9j-4vrj-gf7g / p58f-9548-mpm2 / x78j-v8h9-3j2q);
    # all are fixed by 21.7.13, the highest fix version across the set.
    "virtualenv>=21.7.13",
    # mcp 1.29.0 is flagged for CVE-2026-59951; 1.30.0 is the fix within
    # claude-agent-sdk's mcp>=1.23.0,<2.0.0 range (2.2.0 is out of range).
    "mcp>=1.30.0,<2",
    # certifi 2026.5.20 is flagged for GHSA-6q48-6c7w-9gw2; 2026.10.19 is the fix.
    "certifi>=2026.10.19",
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http.git@7557325f0cd08e47124b588710da011951feb421",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config.git", rev = "48e736bad05ff514360f93092a5f486a6aee1fe1" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio.git", rev = "a9aecb4d4fd7f30428df37e24e94a0dae0cd6237" }  # pragma: allowlist secret
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http.git", rev = "7557325f0cd08e47124b588710da011951feb421" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules.git", rev = "b2e82231fa2f260589be9ba757c6be450f4e5d3e" }

[tool.hatch.build.targets.wheel]
packages = ["src/robotsix_calendar"]

[tool.deptry]
known_first_party = ["robotsix_calendar"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "T10", "EXE", "ARG", "C4", "PERF", "PT", "ERA", "PGH", "D"]
ignore = ["S101", "PT006", "D105", "D107", "D205", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/robotsix_calendar/healthcheck/__init__.py" = ["T201"]
"vulture_whitelist.py" = ["B018", "F821", "D"]
"tests/**/*.py" = ["S105", "S106", "S603", "D"]
"src/robotsix_calendar/api/**/*.py" = ["B008", "ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["vulture_whitelist.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
    "error",
]
markers = ["integration: Slower tests using an in-process Radicale server"]
strict_markers = true

[tool.coverage.run]
source = ["robotsix_calendar"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "src/robotsix_calendar/__init__.py",
]
update_changelog_on_bump = true
changelog_incremental = true
tag_format = "v$version"
